
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "docchat-ariana"
version = "0.1.0"
description = "A chatbot that remembers conversations"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "groq",
    "python-dotenv"
]


[tool.setuptools]
py-modules = ["chat"]
packages = ["tools"]

[project.scripts]
chat = "chat:main"

